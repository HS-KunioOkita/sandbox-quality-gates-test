id: L1-01-eslint-disable-abuse
pitfall: eslint-disable でファイル全体を黙らせる
claimed_layer: L1
expect:
  l2-install: pass
  l1-typecheck: pass
  l1-lint: fail
  l2-semgrep: pass
  l2-osv: pass
  l2-gitleaks: pass
  l3-test: pass
  l3-openapi-drift: pass
  # 実測: fail。差分限定 Stryker は orders.service.ts をファイル単位でミューテートする。
  # 同ファイルのフル実行スコアは 40.00%（閾値 50 を下回る）で、この eslint-disable の
  # 追加自体はロジックを変えていないが、閾値割れそのものは変わらず fail(1) になる
  # （claimVerdict 自体は l1-lint で match のため影響なし）。
  l4-mutation: fail
expect_detection:
  l2-new-deps: false
