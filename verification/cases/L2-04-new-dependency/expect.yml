id: L2-04-new-dependency
pitfall: 実在する新規依存を追加する
claimed_layer: L2
# 手順書 §3.3 の末尾は「新規依存の追加は人間承認を必須にする」と述べ、
# 検出のみでブロックしない運用を示している。
claimed_gate: l2-new-deps
expect:
  l2-install: pass
  l1-typecheck: pass
  l1-lint: pass
  l2-semgrep: pass
  l2-osv: pass
  # 実測: fail。L2-04 自身の差分に秘密は無い。原因は l4-mutation が Phase 4 で
  # 持ち込んだ副作用: apps/api/reports/mutation/mutation.json
  # (mutation.html も同様) は gitignore 済みで run-case.sh の cleanup（git checkout /
  # branch -D）でも消えず、ミューテートしたソースファイルの全文（コメント含む）を
  # 埋め込む。.gitleaks.toml の allowlist にこのパスが無いため、l2-gitleaks は
  # --no-git で working tree 全体を素直に走査してこれを拾う。run-all.sh は
  # verification/cases/*/ をアルファベット順に実行するため、必ず直前に
  # L2-03-hardcoded-secret（orders.service.ts に PAYMENT_API_KEY /
  # PAYMENT_API_SECRET を追加するケース）が走る。その l4-mutation が
  # orders.service.ts をミューテートしてレポートに秘密文字列を埋め込んだまま
  # 残り、L2-04（同じ orders.service.ts を touch する）の l2-gitleaks 実行時点
  # （l4-mutation より前のゲート順）でまだ上書きされていないためこの leak を検出する。
  # 実測で再現: run-case.sh L2-03 → run-case.sh L2-04 の順で単体実行すると
  # l2-gitleaks=1（leaks found: 2）。L2-04 を単独実行（直前が L2-03 でない）
  # すると l2-gitleaks=0（pass）に戻る。Phase 3 には l4-mutation が無く
  # reports/mutation/ も生成されなかったため、この経路は Phase 4 で新たに
  # 持ち込まれたものである。run-all.sh の固定実行順（アルファベット順）のもとでは
  # 再現性がある「実測」として fail と書く。
  l2-gitleaks: fail
  l3-test: pass
  l3-openapi-drift: pass
  # 予測: fail。case.patch は orders.service.ts に dayjs を使う定数とフィールドを
  # 追加するだけだが、差分限定 Stryker はファイル単位でミューテートするため対象は
  # 同ファイル全体になる。同ファイルのフル実行スコアは 40.00%（閾値 50 を下回る）ため、
  # 追加分がテストで覆われていなくても閾値割れという結果自体は変わらない見込み
  # （run-all.sh で実測確認）。
  l4-mutation: fail
expect_detection:
  l2-new-deps: true
