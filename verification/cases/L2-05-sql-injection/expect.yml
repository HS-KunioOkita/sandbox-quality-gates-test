id: L2-05-sql-injection
pitfall: $queryRawUnsafe で文字列連結して SQL を組み立てる
claimed_layer: L2
claimed_gate: l2-semgrep
expect:
  l2-install: pass
  l1-typecheck: pass
  l1-lint: pass
  # 実測: 5 つのルールセット + カスタムルールを回しても 0 findings。
  # $queryRawUnsafe の文字列連結には無反応（claimed_layer/claimed_gate は変更しない。not-caught が成果物）。
  l2-semgrep: pass
  l2-osv: pass
  l2-gitleaks: pass
  # 実測: fail。$queryRawUnsafe への置き換えで findByUser の呼び出し形が変わり、
  # orders.service.spec.ts が固定していた findMany 呼び出しのアサーションと
  # test/orders.int-spec.ts が落ちる。SQL インジェクションそのものを検出した
  # わけではなく、クエリ形の変化がテストのアサーションを壊した副作用である
  # （claimed_layer/claimed_gate は変更しない。mismatch が成果物）。
  l3-test: fail
  l3-openapi-drift: pass
expect_detection:
  l2-new-deps: false
