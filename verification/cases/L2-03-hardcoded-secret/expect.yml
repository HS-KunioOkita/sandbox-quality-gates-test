id: L2-03-hardcoded-secret
pitfall: API キーらしき文字列をハードコードする
claimed_layer: L2
# 手順書は §3.2 の p/secrets と §3.3 ③ の gitleaks の 2 経路を用意している。
# どちらか一方でも捕まえれば層としては一致する。ツール名は名指しされていないので
# claimed_gate は書かない。
expect:
  l2-install: pass
  l1-typecheck: pass
  l1-lint: pass
  l2-semgrep: fail
  l2-osv: pass
  l2-gitleaks: fail
  l3-test: pass
  l3-openapi-drift: pass
  # 予測: fail。case.patch は orders.service.ts に定数とフィールドを追加するだけだが、
  # 差分限定 Stryker はファイル単位でミューテートするため対象は同ファイル全体になる。
  # 同ファイルのフル実行スコアは 40.00%（閾値 50 を下回る）ため、追加分がテストで
  # 覆われていなくても閾値割れという結果自体は変わらない見込み（run-all.sh で実測確認）。
  l4-mutation: fail
expect_detection:
  l2-new-deps: false
