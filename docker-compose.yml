services:
  postgres:
    image: postgres:16-alpine
    container_name: quality-gates-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quality_gates
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d quality_gates']
      interval: 5s
      timeout: 5s
      retries: 10
