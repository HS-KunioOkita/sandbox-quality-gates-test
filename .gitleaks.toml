# gitleaks の allowlist。
#
# 検証ケースのパッチと設計/計画ドキュメントは、意図的に秘密らしい文字列を含む。
# これらは「適用前の記述」なので走査しない。
#
# 除外は必ず「パス」で行い、「値」で行わないこと。値で除外すると、L2-03 のパッチを
# 適用して apps/ 配下に同じ文字列が現れたときも除外され、ゲートが空振りする。
# それでは L2-03 が「gitleaks は秘密を検出しなかった」という誤った結果を出す。
#
# .superpowers/ 配下は gitignore 済みの開発ハーネス用スクラッチ（タスクブリーフ/
# レポートに加え、レビュー用の差分パッケージ `review-<sha>..<sha>.diff` もここに
# 生成される）であり、本プロジェクトの成果物ではない。L2-03 のパッチに含めた秘密
# らしい文字列がこの差分パッケージ経由で紛れ込むため、拡張子を問わず除外する
# （Task 13 で予見・対処）。
#
# パスも意図した範囲（実在する計画/設計ドキュメントのツリー）に絞ること。
# `docs/.*\.md$` は先頭固定していないため、リポジトリのどこかに `docs` という名前の
# ディレクトリを作られると（例: `apps/web/docs/notes.ts.md`）そこも一致してしまう
# 盲点があった（レビューで指摘、実測で確認）。実際に秘密らしい文字列を書いている
# 計画/設計ドキュメントは `docs/superpowers/` 配下のみで、`docs/` 直下の手順書本体
# （`docs/多層品質ゲート_L1-L5_導入手順_NestJS-React.md`）は秘密の値そのものを含まない
# （実測: シークレット名の参照のみで、除外パターン無しでも検出されない）ため、
# `docs/superpowers/` までで絞ってよい。
[extend]
useDefault = true

[allowlist]
description = "検証ケースのパッチと設計/計画ドキュメント（docs/superpowers/ 配下）、および本プロジェクトのタスク管理ドキュメント（.superpowers/ 配下）は意図的に秘密らしい文字列を含む"
paths = [
  '''verification/cases/.*\.patch$''',
  '''docs/superpowers/.*\.md$''',
  # .superpowers/ 配下（タスクブリーフ/レポート、レビュー用差分パッケージ .diff 等）は
  # 拡張子によらず除外する。本タスク（L2-gitleaks）自身の Step 6 手順（実在形式キーの
  # 例示）や、L2-03 のパッチに含めた秘密らしい文字列がここに現れるため
  # （`.md$` 限定のパターンでは拡張子の異なる `.diff` に一致しない。これは正規表現の
  # 構成上そうなるだけで、実測して確かめたことではない）。
  '''\.superpowers/.*''',
]
