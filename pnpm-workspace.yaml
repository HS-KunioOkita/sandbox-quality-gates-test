packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false # swagger-ui-dist の推移的依存。postinstall は利用状況を Scarf 社へ送信するだけの計測用スクリプトで、ビルドには不要
  cpu-features: false # ssh2 の native crypto 高速化用。Docker はローカルソケット経由のみで使い、ssh2 の SSH 接続機能は使わないため不要
  prisma: true
  protobufjs: false # postinstall は devDependencies の versionScheme 警告を出すだけで、ビルドは発生しない
  ssh2: false # @testcontainers/postgresql の推移的依存（Docker の ssh:// ホスト対応）。ローカル Docker Desktop のみが対象で SSH 経由の接続はしない
  unrs-resolver: true

# 供給網対策。semgrep の p/nodejs が要求する 3 つ（実測で findings として挙がった）。
# 手順書 §3.3 は「架空パッケージ・供給網対策」を掲げながら pnpm 側のこれらの設定に
# 触れていない。§1 の修正提案として記録する。
blockExoticSubdeps: true # 推移的依存を信頼できない配布元から入れさせない
minimumReleaseAge: 10080 # 公開から 7 日（分）経っていない版は入れない
trustPolicy: no-downgrade # 更新でセキュリティ設定が引き下げられるのを防ぐ

# minimumReleaseAge は「新しく追加しようとしている依存」だけでなく、既に固定している
# 依存も lockfile を書き換える操作（pnpm add 等）のたびに再検証する。そのため、既存の
# 固定依存が 1 つでも公開から 7 日未満だと、追加しようとしている依存自身が条件を
# 満たしていても pnpm add そのものが全面的に失敗する（Phase 3 Task 1 で実測、
# phase0-findings.md §1.21）。ルート package.json が固定する @types/node@26.1.2 と
# jsdom@30.0.0（いずれも 2026-07-27 公開）が実測時点でこれに該当したため、
# この 2 つだけを除外する。他の直接依存はすべて 7 日ルールの対象のままである。
# pnpm 自身のエラーメッセージ（ERR_PNPM_NO_MATURE_MATCHING_VERSION）も
# minimumReleaseAgeExclude の利用を案内している。
minimumReleaseAgeExclude:
  - '@types/node'
  - jsdom

# brace-expansion 1.1.16 / 2.1.2 は GHSA-mh99-v99m-4gvg（High）。いずれも推移的依存で
# 直接指定していない。修正版 5.0.8 は既に lockfile 内に別経路で入っていたので、
# override で 1 本に集約する。
overrides:
  brace-expansion: 5.0.8
